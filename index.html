<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WIN THE WEEKEND | Cook County Cooks</title>
<meta name="theme-color" content="#070B1A">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;0,900;1,700;1,800;1,900&family=Barlow:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* =====================================================================
   WIN THE WEEKEND — GAME DAY BROADCAST
   Volt lime + blaze orange on midnight navy. Sports-broadcast motion.
   ===================================================================== */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --ink:#070B1A;--ink2:#0B1230;--ink3:#121C4A;
  --volt:#D4FF1E;--blaze:#FF5A1F;--ice:#22D3FF;--hot:#FF3D6E;--uv:#9B7BFF;
  --gold:#FFD23F;--silver:#DDE6F5;--bronze:#FF9A5A;
  --txt:#FFFFFF;--soft:#DDE5FF;--mute:#9FB0D9;--dim:#5E6D99;
  --line:rgba(159,176,217,.18);--line2:rgba(159,176,217,.32);
  --plate:linear-gradient(180deg,rgba(22,33,82,.94),rgba(10,16,44,.94));
  --fd:'Big Shoulders Display','Barlow Condensed',Impact,'Arial Narrow',sans-serif;
  --fc:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --fb:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --ez:cubic-bezier(.16,1,.3,1);--snap:cubic-bezier(.2,1.45,.35,1);--whip:cubic-bezier(.75,0,.25,1);
  --chrome:32px;
  /* legacy names still used by inline JS strings */
  --fox:var(--blaze);--amb:var(--volt);--blu:var(--ice);--grn:#8CFF5A;--red:#FF4D6D;
  --gld:var(--gold);--slv:var(--silver);--brz:var(--bronze);--nx-ink-dim:var(--mute);--nx-line:var(--line)
}
body.deck{--chrome:84px}
html,body{height:100%}
html{background:var(--ink)}
body{position:relative;z-index:0;background:transparent;color:var(--txt);font-family:var(--fb);overflow-x:hidden;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
h1,h2,h3{font-family:var(--fd);font-weight:900}
button{font-family:inherit}

/* ---------- broadcast stage (pure CSS, so the published decks get it too) ---------- */
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;background:
  radial-gradient(70% 55% at 50% 118%,rgba(255,90,31,.30),transparent 70%),
  radial-gradient(55% 45% at 6% -8%,rgba(34,211,255,.20),transparent 70%),
  radial-gradient(45% 40% at 96% -4%,rgba(212,255,30,.12),transparent 70%),
  linear-gradient(180deg,#060918 0%,#0A1132 58%,#0B0E24 100%)}
body::after{content:"";position:fixed;top:-10%;bottom:-10%;left:-10%;width:calc(120% + 450px);z-index:-1;pointer-events:none;background:repeating-linear-gradient(115deg,rgba(255,255,255,.028) 0 2px,transparent 2px 40px);animation:wtwStripes 22s linear infinite;will-change:transform}
@keyframes wtwStripes{to{transform:translate3d(-441.35px,0,0)}}

/* =====================================================================
   PRE-GAME BUILDER (setup screen)
   ===================================================================== */
#S{position:relative;z-index:1;min-height:100vh;padding:clamp(1rem,3vw,2.2rem) clamp(.9rem,3vw,2rem) 3rem;overflow-y:auto}
.si{max-width:760px;margin:0 auto}
.sl{display:block;width:118px;height:118px;margin:0 auto .7rem;border-radius:50%;box-shadow:0 0 0 4px #07101F,0 0 0 7px var(--volt),0 0 44px rgba(212,255,30,.45);animation:wtwPopIn .8s var(--snap) both}
#S h1{font:900 clamp(2.6rem,8vw,4.4rem)/.88 var(--fd);text-transform:uppercase;text-align:center;color:#fff;letter-spacing:.01em;text-shadow:.05em .05em 0 var(--blaze);transform:skewX(-7deg);animation:wtwRise .7s var(--ez) .1s both}
.tg{text-align:center;font:800 .8rem var(--fc);letter-spacing:.34em;text-transform:uppercase;color:var(--volt);margin:.7rem 0 1.5rem;animation:wtwRise .7s var(--ez) .2s both}
.bx{position:relative;background:var(--plate);border:1px solid var(--line);padding:1.15rem 1.25rem 1.1rem 1.5rem;margin-bottom:1rem;animation:wtwRise .7s var(--ez) both}
.bx::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(var(--volt),var(--blaze))}
.si>.bx:nth-of-type(1){animation-delay:.25s}.si>.bx:nth-of-type(2){animation-delay:.32s}.si>.bx:nth-of-type(3){animation-delay:.39s}.si>.bx:nth-of-type(4){animation-delay:.46s}.si>.bx:nth-of-type(5){animation-delay:.53s}
.bx h2{font:900 clamp(1.35rem,3.4vw,1.7rem)/1 var(--fd);text-transform:uppercase;color:#fff;margin-bottom:.85rem;display:flex;align-items:center;gap:.65rem;letter-spacing:.01em}
.bx h2 .n{background:var(--volt);color:#07101F;min-width:32px;height:30px;display:grid;place-items:center;font:italic 900 1.05rem var(--fc);transform:skewX(-12deg)}
.fl{margin-bottom:.75rem}
.fl label{display:block;font:700 .74rem var(--fc);color:var(--mute);text-transform:uppercase;letter-spacing:.16em;margin-bottom:.3rem}
.fl input[type=text],.fl textarea,.fl select{width:100%;padding:.6rem .75rem;background:rgba(5,9,26,.75);border:1px solid var(--line2);color:#fff;font:600 .95rem var(--fb);border-radius:0;outline:none;transition:border-color .2s,box-shadow .2s}
.fl input[type=text]:focus,.fl textarea:focus,.fl select:focus{border-color:var(--volt);box-shadow:0 0 0 3px rgba(212,255,30,.18)}
.fl textarea{min-height:70px;resize:vertical;white-space:pre-wrap}
.fl select option,.fl select optgroup{background:#0B1230;color:#fff}
.fl input[type=checkbox]{accent-color:var(--volt);width:16px;height:16px;vertical-align:-3px;margin-right:.35rem}
.ur{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}
.ub{position:relative;padding:.5rem 1.1rem;font:800 .95rem var(--fc);letter-spacing:.12em;text-transform:uppercase;background:rgba(255,255,255,.07);color:#fff;border:1px solid var(--line2);cursor:pointer;white-space:nowrap;transform:skewX(-10deg);transition:background .2s,color .2s,border-color .2s,transform .15s}
.ub:hover{background:var(--volt);color:#07101F;border-color:var(--volt)}
.ub:active{transform:skewX(-10deg) scale(.96)}
.ub.ok{background:var(--grn);color:#07101F;border-color:var(--grn)}
.un{font:600 .8rem var(--fc);letter-spacing:.06em;color:var(--mute)}
.hf{display:none}
.dr{display:flex;gap:.8rem;margin-bottom:.4rem}
.db{flex:1;padding:.85rem .6rem;font:900 clamp(1.2rem,3.6vw,1.6rem)/1 var(--fd);text-transform:uppercase;text-align:center;border:2px solid var(--line2);background:rgba(5,9,26,.6);color:var(--mute);cursor:pointer;transform:skewX(-8deg);transition:all .25s var(--ez)}
.db:hover{border-color:var(--volt);color:#fff}
.db.on{background:var(--volt);border-color:var(--volt);color:#07101F;box-shadow:6px 6px 0 var(--blaze)}
.cb{background:rgba(5,9,26,.55);border:1px solid var(--line);padding:.9rem;margin-bottom:.8rem}
.cb h3{font:900 1.15rem var(--fd);text-transform:uppercase;letter-spacing:.02em;color:var(--ice);margin-bottom:.6rem}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
@media(max-width:560px){.cg{grid-template-columns:1fr}}
.gb{display:block;width:100%;padding:1rem;font:900 clamp(1.5rem,4.4vw,2.1rem)/1 var(--fd);text-transform:uppercase;letter-spacing:.02em;text-align:center;background:var(--volt);color:#07101F;border:0;cursor:pointer;margin-top:.8rem;transform:skewX(-6deg);box-shadow:8px 8px 0 var(--blaze);transition:transform .15s,box-shadow .2s;animation:wtwRise .7s var(--ez) .6s both,wtwGlow 2.4s ease-in-out 1.4s infinite}
.gb:hover:not(:disabled){transform:skewX(-6deg) translate(-2px,-2px);box-shadow:11px 11px 0 var(--blaze)}
.gb:disabled{opacity:.3;cursor:not-allowed;animation:wtwRise .7s var(--ez) .6s both}
@keyframes wtwGlow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.12) drop-shadow(0 0 18px rgba(212,255,30,.55))}}
.sm{text-align:center;padding:.3rem;font:700 .85rem var(--fc);letter-spacing:.06em;color:var(--grn);margin-top:.3rem}
.npsStatus{font:600 .92rem var(--fb);padding:.8rem 1rem;background:rgba(34,211,255,.06);border:1px solid rgba(34,211,255,.3);border-left:4px solid var(--ice);color:var(--soft);display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.npsStatus.ok{background:rgba(140,255,90,.07);border-color:rgba(140,255,90,.35);border-left-color:var(--grn);color:#DFFFD0}
.npsStatus.err{background:rgba(255,77,109,.08);border-color:rgba(255,77,109,.4);border-left-color:var(--red);color:#FFD2DA}
.npsHint{font:500 .78rem var(--fb);color:var(--mute);margin-top:.45rem}
.liveTag{font:italic 900 .62em var(--fc);color:#07101F;background:var(--volt);padding:.18em .55em;letter-spacing:.14em;transform:skewX(-10deg);display:inline-block;animation:wtwLive 1.6s ease-in-out infinite}
@keyframes wtwLive{0%,100%{opacity:1}50%{opacity:.5}}
.xfinbox{border:1px solid rgba(255,210,63,.45)!important;background:linear-gradient(180deg,rgba(255,210,63,.07),rgba(5,9,26,.55))!important}
.xfinbox h3{color:var(--gold)!important}
.xfinbox .opt{font:600 .62em var(--fc);color:var(--mute);letter-spacing:.06em;text-transform:none}
.contestRow{position:relative;border:1px dashed rgba(255,210,63,.4);padding:.95rem;margin-bottom:.8rem;background:rgba(255,210,63,.04)}
.rmc{position:absolute;top:.55rem;right:.55rem;background:transparent;border:1px solid var(--red);color:var(--red);font:700 .72rem var(--fc);letter-spacing:.1em;text-transform:uppercase;padding:.22rem .55rem;cursor:pointer}
.rmc:hover{background:var(--red);color:#fff}
.addc{background:var(--gold)!important;color:#07101F!important;border-color:var(--gold)!important}

/* =====================================================================
   DECK
   ===================================================================== */
#D{display:none;position:fixed;inset:0;z-index:1}
.s{position:absolute;inset:0;opacity:0;pointer-events:none;display:flex;flex-direction:column;justify-content:safe center;padding:clamp(.9rem,2.8vh,2.2rem) clamp(.9rem,3vw,2.6rem) calc(var(--chrome) + clamp(.8rem,2vh,1.4rem));overflow-y:auto;overflow-x:hidden;gap:clamp(.7rem,2.2vh,1.6rem);scrollbar-width:none}
.s::-webkit-scrollbar{display:none}
.s.a{opacity:1;pointer-events:all}
#wm{display:none!important}

/* ---------- chyron heading ---------- */
.hd{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;flex-shrink:0;z-index:1}
.kick{display:inline-block;background:var(--volt);color:#07101F;padding:.26em 1em .22em;font:italic 900 clamp(.78rem,1.6vw,1.05rem)/1 var(--fc);letter-spacing:.24em;text-transform:uppercase;transform:skewX(-14deg);box-shadow:5px 5px 0 var(--blaze)}
.kick span{display:block;transform:skewX(14deg)}
.hd h2{position:relative;display:inline-block;margin-top:.4rem;font:900 clamp(2.2rem,min(6.2vw,8.4vh),4.6rem)/.9 var(--fd);text-transform:uppercase;letter-spacing:.005em;color:#fff;transform:skewX(-6deg);text-shadow:.04em .04em 0 rgba(255,90,31,.85)}
.hd h2::before,.hd h2::after{content:attr(data-t);position:absolute;inset:0;color:transparent;-webkit-text-stroke:2px var(--volt);text-shadow:none;opacity:0;pointer-events:none}
.hd h2::after{-webkit-text-stroke-color:var(--ice)}
.hd .ln{height:4px;width:min(360px,56vw);margin-top:.5rem;background:linear-gradient(90deg,transparent,var(--blaze) 18%,var(--volt) 50%,var(--ice) 82%,transparent)}

.s.a .hd .kick{animation:wtwKick .55s var(--ez) both}
.s.a .hd h2{animation:wtwSlam .7s var(--snap) .08s both}
.s.a .hd h2::before{animation:wtwEchoL .8s ease-out .12s both}
.s.a .hd h2::after{animation:wtwEchoR .8s ease-out .16s both}
.s.a .hd .ln{animation:wtwLine .6s var(--ez) .35s both}

/* ---------- TOP 5 ---------- */
.t5{max-width:1020px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:clamp(.35rem,1.2vh,.8rem);padding:.2rem .9rem;overflow:clip;overflow-clip-margin:18px}
.t5r{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:clamp(.8rem,2.2vw,1.8rem);padding:clamp(.5rem,1.5vh,1rem) clamp(1rem,2.6vw,2rem) clamp(.5rem,1.5vh,1rem) 0;isolation:isolate;--rc:#34457F;--rt:#fff}
.t5r::before{content:"";position:absolute;inset:0;z-index:-2;transform:skewX(-12deg);background:linear-gradient(90deg,rgba(26,39,94,.96),rgba(12,19,50,.92));border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
.t5r::after{content:"";position:absolute;top:0;bottom:0;left:0;width:26%;z-index:-1;background:linear-gradient(100deg,transparent,rgba(255,255,255,.24),transparent);transform:translateX(-140%) skewX(-12deg);opacity:0;pointer-events:none}
.t5r:nth-child(1){--rc:var(--gold);--rt:#07101F}.t5r:nth-child(2){--rc:var(--silver);--rt:#07101F}.t5r:nth-child(3){--rc:var(--bronze);--rt:#07101F}
.t5r:nth-child(1)::before{border-color:rgba(255,210,63,.65);background:linear-gradient(90deg,rgba(64,52,20,.95),rgba(26,39,94,.95) 45%,rgba(12,19,50,.92))}
.t5p{position:relative;align-self:stretch;min-width:clamp(3.2rem,7.5vw,5rem);margin:calc(-1*clamp(.5rem,1.5vh,1rem)) 0;display:grid;place-items:center;font:italic 900 clamp(2rem,min(5vw,6.4vh),3.4rem)/1 var(--fc);color:var(--rt);z-index:0}
.t5p::before{content:"";position:absolute;inset:0;z-index:-1;transform:skewX(-12deg);background:var(--rc)}
.t5n{min-width:0}
.t5nm{font:800 clamp(1.35rem,min(3.6vw,4.8vh),2.5rem)/1 var(--fc);text-transform:uppercase;letter-spacing:.02em;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t5d{font:700 clamp(.66rem,1.3vw,.84rem)/1.3 var(--fc);letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin-top:.18rem}
.t5v{font:italic 800 clamp(1.6rem,min(4.3vw,5.8vh),3rem)/1 var(--fc);color:var(--volt);white-space:nowrap;font-variant-numeric:tabular-nums;text-shadow:0 0 22px rgba(212,255,30,.35)}
.t5r:nth-child(1) .t5v{font-size:clamp(1.9rem,min(5vw,6.6vh),3.5rem);color:var(--gold);text-shadow:0 0 26px rgba(255,210,63,.45)}
.s.a .t5r:nth-child(odd){animation:wtwRowL .75s var(--ez) both}
.s.a .t5r:nth-child(even){animation:wtwRowR .75s var(--ez) both}
.s.a .t5r:nth-child(1){animation-delay:.18s}.s.a .t5r:nth-child(2){animation-delay:.28s}.s.a .t5r:nth-child(3){animation-delay:.38s}.s.a .t5r:nth-child(4){animation-delay:.48s}.s.a .t5r:nth-child(5){animation-delay:.58s}
.s.a .t5r::after{animation:wtwSweep .9s ease-out .75s both}
.s.a .t5r:nth-child(1)::after{animation:wtwSweep .9s ease-out .75s both,wtwSweep 1.1s ease-out 3s infinite}
.s.a .t5r .t5p{animation:wtwPopIn .55s var(--snap) both}
.s.a .t5r:nth-child(1) .t5p{animation-delay:.42s}.s.a .t5r:nth-child(2) .t5p{animation-delay:.52s}.s.a .t5r:nth-child(3) .t5p{animation-delay:.62s}.s.a .t5r:nth-child(4) .t5p{animation-delay:.72s}.s.a .t5r:nth-child(5) .t5p{animation-delay:.82s}

/* ---------- STANDINGS TABLES ---------- */
.tw{position:relative;max-width:1340px;width:100%;margin:0 auto;overflow:auto;min-height:0;background:rgba(7,12,34,.78);border:1px solid var(--line);border-top:3px solid var(--volt)}
.tb{width:100%;border-collapse:separate;border-spacing:0;font-family:var(--fc)}
.tb thead th{position:sticky;top:0;z-index:2;background:#0E1740;color:var(--volt);font-weight:800;letter-spacing:.12em;text-transform:uppercase;text-align:center;white-space:nowrap;border-bottom:2px solid var(--blaze)}
.tb thead th:nth-child(2),.tb thead th:nth-child(3){text-align:left}
.tb tbody td{text-align:center;white-space:nowrap;font-weight:600;color:var(--soft);border-bottom:1px solid rgba(159,176,217,.1);font-variant-numeric:tabular-nums}
.tb tbody tr:nth-child(even) td{background:rgba(255,255,255,.028)}
.tb tbody td:nth-child(1){font-style:italic;font-weight:900;color:var(--ice)}
.tb tbody td:nth-child(2){text-align:left;font-weight:800;color:#fff;text-transform:uppercase;letter-spacing:.02em}
.tb tbody td:nth-child(3){text-align:left;color:var(--mute);font-weight:600}
.tb .mo{color:var(--volt)!important;font-weight:800!important}
.tb tbody tr:nth-child(1) td:nth-child(1){color:var(--gold);box-shadow:inset 5px 0 0 var(--gold)}
.tb tbody tr:nth-child(2) td:nth-child(1){color:var(--silver);box-shadow:inset 5px 0 0 var(--silver)}
.tb tbody tr:nth-child(3) td:nth-child(1){color:var(--bronze);box-shadow:inset 5px 0 0 var(--bronze)}
.tb tbody tr:nth-child(1) td{background:rgba(255,210,63,.07)}
.tb tbody tr:hover td{background:rgba(212,255,30,.07)}
.s.a .tb tbody tr{animation:wtwTr .5s var(--ez) both}
.s.a .tb tbody tr:nth-child(1){animation-delay:.2s}.s.a .tb tbody tr:nth-child(2){animation-delay:.24s}.s.a .tb tbody tr:nth-child(3){animation-delay:.28s}.s.a .tb tbody tr:nth-child(4){animation-delay:.32s}.s.a .tb tbody tr:nth-child(5){animation-delay:.36s}.s.a .tb tbody tr:nth-child(6){animation-delay:.4s}.s.a .tb tbody tr:nth-child(7){animation-delay:.44s}.s.a .tb tbody tr:nth-child(8){animation-delay:.48s}.s.a .tb tbody tr:nth-child(9){animation-delay:.52s}.s.a .tb tbody tr:nth-child(10){animation-delay:.56s}.s.a .tb tbody tr:nth-child(11){animation-delay:.6s}.s.a .tb tbody tr:nth-child(12){animation-delay:.64s}.s.a .tb tbody tr:nth-child(13){animation-delay:.68s}.s.a .tb tbody tr:nth-child(14){animation-delay:.72s}.s.a .tb tbody tr:nth-child(15){animation-delay:.76s}.s.a .tb tbody tr:nth-child(16){animation-delay:.8s}.s.a .tb tbody tr:nth-child(17){animation-delay:.84s}.s.a .tb tbody tr:nth-child(18){animation-delay:.88s}.s.a .tb tbody tr:nth-child(19){animation-delay:.92s}.s.a .tb tbody tr:nth-child(n+20){animation-delay:.96s}
.s.a .tw::after{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--volt);box-shadow:0 0 18px 4px rgba(212,255,30,.55);pointer-events:none;z-index:3;animation:wtwScan 1.3s var(--whip) .3s both}
/* fit-to-slide sizing: every row on one screen at 1366x768 and up */
.s:has(.tw){padding-top:clamp(.6rem,1.9vh,2rem);gap:clamp(.35rem,1.2vh,1.4rem)}
.s:has(.tw) .hd h2{font-size:clamp(1.5rem,min(6vw,5.2vh),3.9rem)}
.s:has(.tw) .hd .ln{margin-top:.25rem}
.tb thead th{padding:clamp(.2rem,.7vh,.8rem) clamp(.25rem,.5vw,.6rem);font-size:clamp(.66rem,min(1.9vw,1.8vh),1.12rem);line-height:1.15}
.tb tbody td{padding:clamp(.1rem,.5vh,.72rem) clamp(.25rem,.5vw,.6rem);font-size:clamp(.72rem,min(2.2vw,2.1vh),1.3rem);line-height:1.12}
.tb tbody td:nth-child(1){font-size:clamp(.8rem,min(3vw,2.3vh),1.7rem)}
.tb tbody td:nth-child(2){font-size:clamp(.78rem,min(2.5vw,2.25vh),1.45rem)}

/* ---------- DISTRICT RANKER ---------- */
.dg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:clamp(.8rem,2vw,1.4rem);max-width:1420px;width:100%;margin:0 auto;perspective:1400px}
.dc{position:relative;background:linear-gradient(180deg,#131E4E,#0A1030);border:1px solid var(--line);padding-bottom:clamp(.8rem,2vw,1.2rem);clip-path:polygon(0 0,calc(100% - 24px) 0,100% 24px,100% 100%,24px 100%,0 calc(100% - 24px));transform-origin:50% 100%}
.dc h3{background:linear-gradient(90deg,var(--blaze),#FF7A3D);color:#fff;font:900 clamp(1.4rem,3.2vw,2.1rem)/1 var(--fd);text-transform:uppercase;letter-spacing:.02em;padding:.6rem 2rem .52rem 1rem}
.dc .dsc{padding:0 1rem;margin-top:.5rem;font:700 clamp(.66rem,1.4vw,.8rem) var(--fc);letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.rkbox{position:relative;margin:.65rem 1rem .75rem;display:flex;align-items:center;justify-content:space-between;gap:.5rem;background:var(--volt);color:#07101F;padding:.3rem .95rem;transform:skewX(-10deg);overflow:hidden}
.rkbox>*{transform:skewX(10deg)}

/* Route the <audio> through an analyser so the title screen dances to the
   real music. Only on http(s) (file:// would mute it) and only while the
   context is actually running — otherwise the visuals fake the beat. */
function hypeWire(){
  if(HYPE.src||!HYPE.actx||HYPE.actx.state!=='running')return;
  if(!/^https?:$/.test(location.protocol))return;
  try{
    var a=hypeA();
    HYPE.src=HYPE.actx.createMediaElementSource(a);
    HYPE.an=HYPE.actx.createAnalyser();HYPE.an.fftSize=256;HYPE.an.smoothingTimeConstant=.72;
    HYPE.src.connect(HYPE.an);HYPE.an.connect(HYPE.actx.destination);
    HYPE.data=new Uint8Array(HYPE.an.frequencyBinCount);
  }catch(e){HYPE.an=null;}
}

  Object.keys(bs).forEach(function(st){(bs[st]||[]).forEach(function(nm){

  var storeDMs={},raw=(sd&&sd.storeDMs)||{};Object.keys(raw).forEach(function(k){storeDMs[k]=String(raw[k]).toLowerCase();});

function animateNPS(slideEl){
  if(!slideEl)return;
  var bars=slideEl.querySelectorAll('.npsbar[data-nps], .npsval[data-nps]');
  var DUR=900;
  var easeOutCubic=function(t){return 1-Math.pow(1-t,3);};
  bars.forEach(function(bar){
    if(bar._npsRAF){cancelAnimationFrame(bar._npsRAF);bar._npsRAF=null;}
    var target=parseFloat(bar.getAttribute('data-nps'))||0;
    var fill=bar.querySelector('.npsfill');
    var num=bar.querySelector('.npsnum');
    bar.style.setProperty('--v',0);
    if(fill)fill.style.width='0%';
    if(num)num.textContent='0';
    var start=null;
    function step(ts){
      if(start===null)start=ts;
      var p=Math.min(1,(ts-start)/DUR);
      var k=easeOutCubic(p);
      var v=target*k;
      if(fill)fill.style.width=v+'%';
      bar.style.setProperty('--v',v);
      if(num)num.textContent=v.toFixed(0);
      if(p<1){bar._npsRAF=requestAnimationFrame(step);}
      else{bar._npsRAF=null;if(num)num.textContent=target.toFixed(0);if(fill)fill.style.width=target+'%';bar.style.setProperty('--v',target);}
    }
    bar._npsRAF=requestAnimationFrame(step);
  });
}

function findHdr(sheet,c0,c1){
  var data=XLSX.utils.sheet_to_json(sheet,{header:1,defval:null});
  for(var i=0;i<Math.min(data.length,30);i++){
    var r=data[i];if(!r)continue;
    if(r[0]!=null&&String(r[0]).trim()===c0&&r[1]!=null&&String(r[1]).trim()===c1)return{idx:i,data:data};
  }
  return null;
}
function parseWB(wb){
  var sr=findHdr(wb.Sheets['Store Rank'],'Rank','Region');
  if(!sr)throw new Error('Cannot find Store Rank headers');

  for(var i=sr.idx+1;i<sr.data.length;i++){
    var r=sr.data[i];if(!r||!r[2])continue;var sn=String(r[2]).trim();
    if(stl.indexOf(sn)<0)continue;
    stores.push({rank:r[0]||0,store:sn,dm:DM_FIX[sn]||String(r[5]||'').trim(),sm:r[6]||'',gpt:r[11]||0,mcr:((r[21]||0)*100),fcr:((r[23]||0)*100),nt:((r[27]||0)*100),mob:r[63]||0,tab:r[64]||0,wat:r[65]||0,gm:r[66]||0,prem:r[70]||0,pp:((r[71]||0)*100),gp:((r[61]||0)*100),hsi:r[59]||0,upg:r[75]||0,up:((r[76]||0)*100),acc:r[87]||0,nps:((r[90]||0)*100),sc:r[117]||0});
  }

  var dr=findHdr(wb.Sheets['District Rank'],'Rank','DM');var dms=[];
  if(dr){var myD=R==='Chicago'?['Jacob Cabrales','Juan Carrillo','Imaad Dhorajiwala','Tanzim Chowdhury']:['Matthew Brooks'];
  /* The sheet's per-metric "Rank" columns hold POINTS (best district = N, worst = 1).
     Collect every district's points so we can display an honest company-wide rank (1 = best). */
  var DRC={gpr:35,mcrr:38,ntr:41,upgr:44,accr:47,npsr:50,premr:56},allPts={},k;for(k in DRC)allPts[k]=[];
  for(var i=dr.idx+1;i<dr.data.length;i++){var r=dr.data[i];if(!r||!r[1])continue;var dm=String(r[1]).trim();
  for(k in DRC){var pv=r[DRC[k]]||0;if(pv>0)allPts[k].push(pv)}
  if(myD.indexOf(dm)<0)continue;
  dms.push({rk:r[0],dm:dm,gp:r[2]||0,fcr:((r[5]||0)*100),mcr:((r[7]||0)*100),pp:((r[24]||0)*100),up:((r[29]||0)*100),acc:r[31]||0,nps:((r[32]||0)*100),sc:r[59]||0,pts:r[58]||0,gpr:r[35]||0,mcrr:r[38]||0,ntr:r[41]||0,upgr:r[44]||0,accr:r[47]||0,npsr:r[50]||0,premr:r[56]||0})}
  /* points -> competition rank: 1 + districts with strictly more points (ties share a rank) */
  dms.forEach(function(d){for(var k2 in DRC){var v=d[k2];if(!(v>0))continue;var better=0;for(var j=0;j<allPts[k2].length;j++){if(allPts[k2][j]>v)better++}d[k2]=better+1}})}
  dms.sort(function(a,b){return a.rk-b.rk});
  var rr=findHdr(wb.Sheets['Rep Rank'],'Rank','Employee');var reps=[];
  /* Filter reps against the stores ACTUALLY PARSED from this workbook, not the hardcoded
     whitelist. A store can be on the whitelist yet have no Sales Report row (North Knoxville),
     in which case its reps used to load with dm:"" and sit in X.reps while appearing in no
     ranking at all. */
  var parsedStores={};stores.forEach(function(s){parsedStores[s.store]=1;});
  if(rr){for(var i=rr.idx+1;i<rr.data.length;i++){var r=rr.data[i];if(!r||!r[3])continue;var loc=String(r[3]).trim();if(parsedStores[loc]!==1)continue;
  reps.push({rk:r[0]||999,nm:String(r[1]||'').trim(),ti:r[2]||'',st:loc,dm:DM_FIX[loc]||String(r[4]||'').trim(),gp:r[6]||0,mob:r[12]||0,tab:r[13]||0,wat:r[14]||0,gm:r[15]||0,prem:r[19]||0,pp:((r[20]||0)*100),gig:r[10]||0,gp2:((r[11]||0)*100),hsi:r[9]||0,upg:r[23]||0,ad:r[22]||0,sc:r[54]||0})}}
  reps.sort(function(a,b){return a.rk-b.rk});
  X={stores:stores,dms:dms,reps:reps};
}

/* =====================================================================
   SCOREBOARD COUNT-UP — numbers roll up like a broadcast graphic.
   A hidden "ghost" copy keeps the final width so nothing reflows.
   ===================================================================== */
function wtwCountUp(root){
  if(!root||WTW_REDUCED)return;
  var els=root.querySelectorAll('[data-cu]'),t0=performance.now();
  els.forEach(function(el,idx){
    var fin=el.getAttribute('data-cuv');
    if(fin==null){fin=el.textContent;el.setAttribute('data-cuv',fin);}
    if(el._cuRAF){cancelAnimationFrame(el._cuRAF);el._cuRAF=0;}
    var m=/-?\d[\d,]*(\.\d+)?/.exec(fin);
    if(!m){el.textContent=fin;return;}
    var num=parseFloat(m[0].replace(/,/g,''));if(!isFinite(num)||num===0){el.textContent=fin;return;}
    var dec=m[1]?m[1].length-1:0,comma=m[0].indexOf(',')>=0||Math.abs(num)>=1000,pre=fin.slice(0,m.index),suf=fin.slice(m.index+m[0].length);
    el.innerHTML='<span class="cu-ghost">'+wtwAttr(fin)+'</span><span class="cu-live"></span>';
    var live=el.lastChild,delay=260+Math.min(idx,14)*60,DUR=1100;
    function fmt(v){var s=v.toFixed(dec);if(comma){var p=s.split('.');p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');s=p.join('.');}return pre+s+suf;}
    live.textContent=fmt(0);
    function step(now){
      var k=Math.max(0,Math.min(1,(now-t0-delay)/DUR));
      var e=k===1?1:1-Math.pow(2,-10*k);
      live.textContent=fmt(num*e);
      if(k<1){el._cuRAF=requestAnimationFrame(step);}else{el._cuRAF=0;el.textContent=fin;}
    }
    el._cuRAF=requestAnimationFrame(step);
  });
}
/* snap any rolling numbers back to their real values (used before publishing) */
function wtwCountFinish(){document.querySelectorAll('[data-cuv]').forEach(function(el){if(el._cuRAF){cancelAnimationFrame(el._cuRAF);el._cuRAF=0;}el.textContent=el.getAttribute('data-cuv');});}

<script>
/* =====================================================================
   GAME DAY FX ENGINE
   Canvas behind the slides: a scrolling stadium grid floor, sweeping
   light beams and speed dust that all pump with the music, plus a
   different broadcast burst every time a slide lands.
   ===================================================================== */
(function(){
"use strict";
if(window.__wtwFX)return;window.__wtwFX=true;

var VOLT="#D4FF1E",BLAZE="#FF5A1F",ICE="#22D3FF",GOLD="#FFD23F",WHITE="#FFFFFF";
var COL=[VOLT,BLAZE,ICE,WHITE,GOLD];

function rand(a,b){return a+Math.random()*(b-a);}
function pick(a){return a[(Math.random()*a.length)|0];}

/* ---------- ambient layer ---------- */

function drawFloor(t,L){
  var hz=H*.64,cx=W/2,floorH=H-hz;

  ctx.save();ctx.globalCompositeOperation="lighter";

  }
  ctx.restore();
}
function drawDust(dt,L){
  ctx.save();ctx.lineCap="round";
  for(var i=0;i<dust.length;i++){
    var p=dust[i],sp=p.v*(1+L*2.2);
    p.x+=sp*dt*.8;p.y-=sp*dt*.45;
    if(p.x>W+30||p.y<-30){p.x=rand(-W*.3,W*.8);p.y=H+rand(0,40);}
    ctx.globalAlpha=Math.min(1,p.a*(1+L));ctx.strokeStyle=p.c;ctx.lineWidth=1.6;
    var l=p.len*(1+L*1.5);
    ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-l*.87,p.y+l*.5);ctx.stroke();
  }
  ctx.restore();
}

/* ---------- bursts (one per slide change) ---------- */
function burstSpeedLines(t0){
  var L=[],i;for(i=0;i<90;i++)L.push({a:rand(0,TAU),r0:rand(40,140),sp:rand(900,1900),w:rand(1.2,3.6),c:pick([WHITE,VOLT,VOLT,ICE]),d:rand(0,.12)});
  return function(now){var e=(now-t0)/1000;ctx.save();ctx.globalCompositeOperation="lighter";ctx.lineCap="round";
    for(var i=0;i<L.length;i++){var s=L[i],se=e-s.d;if(se<=0)continue;var k=Math.min(se/.6,1),f=1-k;if(f<=0)continue;
      var h=s.r0+s.sp*Math.pow(k,.8),tl=h-(60+260*k);ctx.globalAlpha=f;ctx.strokeStyle=s.c;ctx.lineWidth=s.w;
      ctx.beginPath();ctx.moveTo(W/2+Math.cos(s.a)*Math.max(s.r0,tl),H/2+Math.sin(s.a)*Math.max(s.r0,tl));ctx.lineTo(W/2+Math.cos(s.a)*h,H/2+Math.sin(s.a)*h);ctx.stroke();}
    ctx.restore();return e<.8;};
}
function burstSparks(t0,cx,cy){
  cx=cx==null?W/2:cx;cy=cy==null?H/2:cy;var P=[],i;
  for(i=0;i<150;i++){var a=rand(0,TAU),sp=rand(250,950);P.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-rand(0,220),r:rand(1.4,3.6),c:pick(COL),life:rand(.7,1.4)});}
  var last=t0;
  return function(now){var e=(now-t0)/1000,dt=Math.min(.05,(now-last)/1000);last=now;ctx.save();ctx.globalCompositeOperation="lighter";
    if(e<.15){ctx.globalAlpha=(1-e/.15)*.8;var g=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H)*.45);g.addColorStop(0,"rgba(255,255,255,.9)");g.addColorStop(.3,"rgba(212,255,30,.45)");g.addColorStop(1,"rgba(212,255,30,0)");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
    for(var i=0;i<P.length;i++){var p=P[i];if(e>p.life)continue;p.vy+=900*dt;p.vx*=.985;p.x+=p.vx*dt;p.y+=p.vy*dt;var f=1-e/p.life;ctx.globalAlpha=f;ctx.fillStyle=p.c;ctx.fillRect(p.x-p.r/2,p.y-p.r/2,p.r,p.r*2.4);}
    ctx.restore();return e<1.5;};
}
function burstSlash(t0){
  var dir=Math.random()<.5?1:-1,chips=[],i;for(i=0;i<40;i++)chips.push({o:rand(-.5,.5),s:rand(.8,1.3),w:rand(3,10),c:pick([VOLT,BLAZE,WHITE])});
  return function(now){var e=(now-t0)/1000,k=Math.min(e/.55,1),ease=1-Math.pow(1-k,3);ctx.save();ctx.globalCompositeOperation="lighter";
    var x=dir>0?-W*.4+ease*W*1.8:W*1.4-ease*W*1.8;ctx.translate(x,H/2);ctx.rotate(-.32*dir);
    var g=ctx.createLinearGradient(-160,0,160,0);g.addColorStop(0,"rgba(212,255,30,0)");g.addColorStop(.45,"rgba(212,255,30,"+(.55*(1-k))+")");g.addColorStop(.5,"rgba(255,255,255,"+(.85*(1-k))+")");g.addColorStop(.55,"rgba(255,90,31,"+(.5*(1-k))+")");g.addColorStop(1,"rgba(255,90,31,0)");
    ctx.fillStyle=g;ctx.fillRect(-160,-H*1.2,320,H*2.4);
    for(var i=0;i<chips.length;i++){var c=chips[i];ctx.globalAlpha=(1-k)*.9;ctx.fillStyle=c.c;ctx.fillRect(-200*c.s-ease*120,c.o*H*1.6,c.w*6,c.w*.5);}
    ctx.restore();return e<.7;};
}
function burstScan(t0){
  return function(now){var e=(now-t0)/1000,k=Math.min(e/.75,1),y=k*H;ctx.save();ctx.globalCompositeOperation="lighter";
    var g=ctx.createLinearGradient(0,y-140,0,y);g.addColorStop(0,"rgba(34,211,255,0)");g.addColorStop(1,"rgba(34,211,255,"+(.35*(1-k*.5))+")");ctx.fillStyle=g;ctx.fillRect(0,y-140,W,140);
    ctx.globalAlpha=1-k*.4;ctx.fillStyle=VOLT;ctx.shadowColor=VOLT;ctx.shadowBlur=24;ctx.fillRect(0,y-2,W,4);
    ctx.shadowBlur=0;ctx.globalAlpha=.35*(1-k);ctx.strokeStyle=ICE;ctx.lineWidth=1;for(var gx=0;gx<W;gx+=64){ctx.beginPath();ctx.moveTo(gx,0);ctx.lineTo(gx,y);ctx.stroke();}
    ctx.restore();return e<.85;};
}
function burstRings(t0){
  var R=[{d:0,c:VOLT},{d:.1,c:ICE},{d:.2,c:BLAZE}];
  return function(now){var e=(now-t0)/1000;ctx.save();ctx.globalCompositeOperation="lighter";
    for(var i=0;i<R.length;i++){var r=R[i],re=e-r.d;if(re<=0)continue;var k=Math.min(re/.85,1),rad=(1-Math.pow(1-k,3))*Math.max(W,H)*.75,f=1-k;if(f<=0)continue;
      ctx.globalAlpha=f;ctx.strokeStyle=r.c;ctx.lineWidth=2+10*f;ctx.shadowColor=r.c;ctx.shadowBlur=24*f;ctx.beginPath();ctx.arc(W/2,H/2,rad,0,TAU);ctx.stroke();}
    ctx.restore();return e<1.1;};
}
function burstConfetti(t0,cols,fromTop){
  cols=cols||COL;var P=[],i,N=Math.min(220,Math.round(W/6));
  for(i=0;i<N;i++){
    if(fromTop){P.push({x:rand(0,W),y:rand(-H*.7,-10),vx:rand(-40,40),vy:rand(80,240),w:rand(6,13),h:rand(8,16),r:rand(0,TAU),vr:rand(-6,6),c:pick(cols),sw:rand(10,36),sf:rand(1.2,3),sp:rand(0,TAU)});}
    else{var left=i%2===0,a=-Math.PI/2+(left?1:-1)*rand(.12,.75),sp=rand(750,1300);P.push({x:left?-10:W+10,y:H*.95,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,w:rand(6,13),h:rand(8,16),r:rand(0,TAU),vr:rand(-10,10),c:pick(cols),sw:rand(6,20),sf:rand(1.2,3),sp:rand(0,TAU)});}
  }
  var last=t0;
  return function(now){var e=(now-t0)/1000,dt=Math.min(.05,(now-last)/1000);last=now;ctx.save();
    var fade=e>1.8?Math.max(0,1-(e-1.8)/.5):1;
    for(var i=0;i<P.length;i++){var p=P[i];p.vy+=(fromTop?300:1500)*dt;if(!fromTop)p.vx*=.99;p.x+=(p.vx+Math.sin(e*p.sf+p.sp)*p.sw)*dt;p.y+=p.vy*dt;p.r+=p.vr*dt;if(p.y>H+40)continue;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.globalAlpha=fade;ctx.fillStyle=p.c;var sc=.35+.65*Math.abs(Math.cos(p.r*1.3));ctx.fillRect(-p.w/2,-p.h/2*sc,p.w,p.h*sc);ctx.restore();}
    ctx.restore();return e<2.4;};
}
function burstTrophy(t0){
  var st=[],i;for(i=0;i<50;i++)st.push({x:rand(0,1),y:rand(.05,.95),r:rand(1.5,3.5),b:rand(0,.8),f:rand(3,7)});
  return function(now){var e=(now-t0)/1000,env=Math.min(1,e/.3)*(e>1.4?Math.max(0,1-(e-1.4)/.5):1);ctx.save();ctx.globalCompositeOperation="lighter";
    ctx.save();ctx.translate(W/2,H/2);ctx.rotate(e*.45);var R=Math.max(W,H)*.8;
    for(var i=0;i<16;i++){var a=i/16*TAU;var g=ctx.createRadialGradient(0,0,0,0,0,R);g.addColorStop(0,"rgba(255,210,63,0)");g.addColorStop(.45,"rgba(255,210,63,"+(.16*env)+")");g.addColorStop(1,"rgba(212,255,30,0)");ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,R,a-.05,a+.05);ctx.closePath();ctx.fill();}
    ctx.restore();
    for(var k=0;k<st.length;k++){var s=st[k];if(e<s.b)continue;var tw=.5+.5*Math.sin((e-s.b)*s.f);ctx.globalAlpha=env*tw;ctx.fillStyle=GOLD;var px=s.x*W,py=s.y*H,r=s.r;ctx.beginPath();ctx.moveTo(px,py-r*3);ctx.lineTo(px+r,py);ctx.lineTo(px,py+r*3);ctx.lineTo(px-r,py);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(px-r*3,py);ctx.lineTo(px,py-r);ctx.lineTo(px+r*3,py);ctx.lineTo(px,py+r);ctx.closePath();ctx.fill();}
    ctx.restore();return e<1.9;};
}
var ROT=["speed","slash","scan","rings","sparks"],rk=0,scenes=[];
function spawn(el){
  var t0=performance.now(),c=el.classList,list=[];
  if(c.contains("ts")){list.push(burstSparks(t0,W*.3,H*.4));list.push(burstRings(t0));}
  else if(c.contains("cls")){list.push(burstConfetti(t0));list.push(burstRings(t0));}
  else if(c.contains("contest")){list.push(burstConfetti(t0,[GOLD,"#FFE89A",BLAZE,WHITE],true));}
  else if(c.contains("hcs")){list.push(burstTrophy(t0));list.push(burstConfetti(t0,c.contains("xfin")?[GOLD,ICE,WHITE]:[VOLT,BLAZE,GOLD,WHITE]));}
  else{
    var n=ROT[rk++%ROT.length];
    if(n==="speed")list.push(burstSpeedLines(t0));
    else if(n==="slash")list.push(burstSlash(t0));
    else if(n==="scan")list.push(burstScan(t0));
    else if(n==="rings")list.push(burstRings(t0));
    else list.push(burstSparks(t0));
  }
  for(var i=0;i<list.length;i++)scenes.push(list[i]);
}

var raf=0,last=0,t=0;
function frame(now){
  raf=requestAnimationFrame(frame);
  var dt=last?Math.min(.05,(now-last)/1000):0;last=now;t+=dt;
  var L=lvl();
  ctx.clearRect(0,0,W,H);
  drawBeams(t,L);drawFloor(t,L);drawDust(dt,L);
  for(var j=scenes.length-1;j>=0;j--){var ok=false;try{ok=scenes[j](now);}catch(e){ok=false;}if(!ok)scenes.splice(j,1);}
  ctx.globalAlpha=1;ctx.shadowBlur=0;ctx.globalCompositeOperation="source-over";
}
function isSlide(el){return el&&el.nodeType===1&&el.classList&&el.classList.contains("s");}
function mount(){
  if(!document.body)return;
  document.body.insertBefore(cv,document.body.firstChild);resize();
  window.addEventListener("resize",resize,{passive:true});
  if(REDUCED){drawFloor(0,0);return;}
  raf=requestAnimationFrame(frame);
  var prev=new WeakMap();
  new MutationObserver(function(ms){
    for(var k=0;k<ms.length;k++){var el=ms[k].target;if(!isSlide(el))continue;var on=el.classList.contains("a"),was=prev.get(el)||false;if(on&&!was)spawn(el);prev.set(el,on);}
  }).observe(document.body,{subtree:true,attributes:true,attributeFilter:["class"]});
  document.addEventListener("visibilitychange",function(){if(document.hidden){cancelAnimationFrame(raf);raf=0;}else if(!raf){last=0;raf=requestAnimationFrame(frame);}});
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",mount);else mount();
})();
</script>
<script>
/* === FIT-TO-SCREEN: auto-scale the active slide so it fully fits any screen ===
   Measures with motion frozen (.fitm) so fly-in offsets and rolling numbers
   never trick it into shrinking a slide, and only re-fits when a slide
   actually becomes active or the deck is rebuilt. */
(function(){
  function fitSlide(el){
    if(!el) return;
    el.classList.add('fitm');
    el.style.zoom = '';
    for(var i=0;i<3;i++){
      var z = parseFloat(el.style.zoom) || 1;
      var needH = el.scrollHeight, haveH = el.clientHeight;
      var needW = el.scrollWidth,  haveW = el.clientWidth;
      if(needH <= haveH + 1 && needW <= haveW + 1) break;
      var nz = Math.max(.15, z * Math.min(haveH/needH, haveW/needW));
      if(Math.abs(nz - z) < .01) break;
      el.style.zoom = nz;
    }
    el.classList.remove('fitm');
  }
  function fitActive(){
    var els = document.querySelectorAll('#D .s.a');
    for(var i=0;i<els.length;i++) fitSlide(els[i]);
  }
  var t;
  window.addEventListener('resize', function(){ clearTimeout(t); t = setTimeout(fitActive, 120); });
  function boot(){
    var D = document.getElementById('D');
    if(D){
      new MutationObserver(function(ms){
        for(var i=0;i<ms.length;i++){
          var m=ms[i];
          if(m.type==='childList'&&m.target===D){ requestAnimationFrame(fitActive); return; }
          if(m.type==='attributes'&&m.target.parentNode===D&&m.target.classList.contains('s')&&m.target.classList.contains('a')&&!/(^|\s)a(\s|$)/.test(m.oldValue||'')){ requestAnimationFrame(fitActive); return; }
        }
      }).observe(D, { attributes:true, attributeFilter:['class'], attributeOldValue:true, subtree:true, childList:true });
    }
    if(document.fonts && document.fonts.ready) document.fonts.ready.then(fitActive);
    fitActive();
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
